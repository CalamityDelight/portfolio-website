<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Axel af Ugglas</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/studio.css">
</head>
<body class="admin">
  <canvas id="fibres" aria-hidden="true"></canvas>

  <header class="site-header">
    <a class="logo" href="/">Axel af Ugglas<span>AI video work</span></a>
  </header>

  <main class="login">
    <span class="label label--accent">Studio</span>
    <h1 class="login__title">Sign in</h1>

    <form id="login-form" class="stack">
      <div class="field">
        <label for="username">Username</label>
        <input id="username" name="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <p class="form-message" id="login-message" role="alert"></p>
      <button class="btn" type="submit">Sign in</button>
    </form>
  </main>

  <script src="/js/fibres.js"></script>
  <script>
    // Sends the username and password to the server; on success, go to the studio
    const form = document.getElementById('login-form');
    const message = document.getElementById('login-message');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      message.textContent = '';
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: form.username.value,
          password: form.password.value,
        }),
      });
      if (res.ok) {
        location.href = '/studio';
      } else {
        const data = await res.json();
        message.textContent = data.error;
        form.password.value = '';
        form.password.focus();
      }
    });
  </script>
</body>
</html>
